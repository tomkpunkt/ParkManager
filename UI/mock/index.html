<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParkManager – UI-Mock</title><link rel="stylesheet" href="dist/mock.css">
<style>
html{font-size:1px;--menuText1Normal:#eef5f7;--menuText2Normal:#b5c3c9;--panelColorNormal:#26343bdb;--panelBlur:blur(10px);--menuBorderColor1:#71848d;--fontFamily:Arial,sans-serif;--fontSizeS:14rem;--fontSizeXS:11rem;--menuHoverColor:#546673;--menuActiveColor:#4d6975}body{margin:0;background:#182921;color:#eaf4ef;font:14px Arial,sans-serif}
button,input{font:inherit}.mockbar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;padding:10px 16px;background:#0d1b1d;position:fixed;left:0;right:0;bottom:0;z-index:200;box-shadow:0 -4px 18px #0007}.mockbar button,.mockbar label{padding:7px 11px;background:#27434a;color:white;border:1px solid #598084;border-radius:5px;cursor:pointer}.mockbar input{width:72px}.mockbar strong{margin-right:16px}.mocknote{position:relative;padding:9px 16px;background:#3a3220}.map{position:relative;min-height:calc(100vh - 130px);padding-bottom:80px;background:linear-gradient(30deg,#36533d,#50644c)}.map svg{width:100%;height:calc(100vh - 130px);min-height:500px;cursor:crosshair}.map polygon{fill:#66916388;stroke:#62d0ee;stroke-width:2}.map circle{fill:#f4cb62}.report{position:absolute;right:15px;bottom:90px;max-height:270px;overflow:auto;width:340px;padding:12px;background:#13282ee8;border:1px solid #6c9ba0;border-radius:6px}.report button{margin:3px;padding:4px 8px}
</style></head><body><div id="root"></div><script type="module" src="dist/mock.js"></script></body></html>
